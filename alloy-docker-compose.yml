# Docker Compose for Grafana Alloy Version
# Enhanced version with intelligent sorting and dynamic processing capabilities
version: '3.8'

services:
  # Grafana Alloy - The "Smart" Layer with Sorting and Processing
  grafana-alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    command: 
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
    volumes:
      - ./alloy/configs/enhanced-with-sort.alloy:/etc/alloy/config.alloy
      - ./tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "12345:12345"  # Alloy HTTP server
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "13133:13133"  # Health check
      - "8889:8889"    # Metrics
      - "55679:55679"  # zPages
      - "1777:1777"    # pprof
    environment:
      # Application settings
      - APP_NAME=alloy-otel-processor
      - APP_VERSION=1.0.0
      - SERVICE_NAMESPACE=alloy-lab
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      
      # Grafana Cloud settings
      - GRAFANA_CLOUD_INSTANCE_ID=${GRAFANA_CLOUD_INSTANCE_ID}
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY}
      - GRAFANA_CLOUD_PROMETHEUS_URL=${GRAFANA_CLOUD_PROMETHEUS_URL}
      - GRAFANA_CLOUD_TEMPO_URL=${GRAFANA_CLOUD_TEMPO_URL}
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL}
      
      # Infrastructure settings
      - K8S_CLUSTER_NAME=${CLUSTER_NAME}
      - CLOUD_REGION=${REGION}
      - NODE_NAME=docker-node
    networks:
      - alloy-net
    depends_on:
      - prometheus-local
    restart: unless-stopped
    user: "0:0"  # Run as root to access Docker socket

  # Sample App 1: High Priority Service (payment-service)
  telemetrygen-payment:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    container_name: telemetrygen-payment
    command:
      - "traces"
      - "--rate=2"
      - "--duration=60m"
      - "--otlp-insecure"
      - "--otlp-endpoint=grafana-alloy:4317"
      - "--otlp-attributes=service.name=\"payment-service\""
      - "--otlp-attributes=environment=\"prod\""
      - "--otlp-attributes=service.version=\"2.1.0\""
      - "--otlp-attributes=priority=\"high\""
      - "--otlp-attributes=level=\"INFO\""
    depends_on:
      - grafana-alloy
    networks:
      - alloy-net
    restart: unless-stopped

  # Sample App 2: Medium Priority Service (user-service)
  telemetrygen-user:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    container_name: telemetrygen-user
    command:
      - "traces"
      - "--rate=3"
      - "--duration=60m"
      - "--otlp-insecure"
      - "--otlp-endpoint=grafana-alloy:4317"
      - "--otlp-attributes=service.name=\"user-service\""
      - "--otlp-attributes=environment=\"prod\""
      - "--otlp-attributes=service.version=\"1.8.0\""
      - "--otlp-attributes=priority=\"medium\""
      - "--otlp-attributes=level=\"WARN\""
    depends_on:
      - grafana-alloy
    networks:
      - alloy-net
    restart: unless-stopped

  # Sample App 3: Low Priority Service (notification-service)
  telemetrygen-notification:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    container_name: telemetrygen-notification
    command:
      - "traces"
      - "--rate=1"
      - "--duration=60m"
      - "--otlp-insecure"
      - "--otlp-endpoint=grafana-alloy:4317"
      - "--otlp-attributes=service.name=\"notification-service\""
      - "--otlp-attributes=environment=\"prod\""
      - "--otlp-attributes=service.version=\"1.3.0\""
      - "--otlp-attributes=priority=\"low\""
      - "--otlp-attributes=level=\"DEBUG\""
    depends_on:
      - grafana-alloy
    networks:
      - alloy-net
    restart: unless-stopped

  # Sample App 4: Development Environment (should be filtered out)
  telemetrygen-dev:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    container_name: telemetrygen-dev
    command:
      - "traces"
      - "--rate=5"
      - "--duration=60m"
      - "--otlp-insecure"
      - "--otlp-endpoint=grafana-alloy:4317"
      - "--otlp-attributes=service.name=\"test-service\""
      - "--otlp-attributes=environment=\"dev\""
      - "--otlp-attributes=service.version=\"0.1.0\""
      - "--otlp-attributes=priority=\"debug\""
      - "--otlp-attributes=level=\"ERROR\""
    depends_on:
      - grafana-alloy
    networks:
      - alloy-net
    restart: unless-stopped

  # Local Prometheus for metrics collection
  prometheus-local:
    image: prom/prometheus:latest
    container_name: prometheus-local
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - alloy-net
    restart: unless-stopped

  # Grafana for visualization
  grafana-local:
    image: grafana/grafana:latest
    container_name: grafana-local
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - alloy-net
    depends_on:
      - prometheus-local
    restart: unless-stopped

  # Test runner container for running benchmarks and tests
  test-runner:
    image: python:3.11-slim
    container_name: test-runner
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["sleep", "infinity"]
    networks:
      - alloy-net
    depends_on:
      - grafana-alloy
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  alloy_data:

networks:
  alloy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16